name: Keep Predict Rounds Active

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick-predict-rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tick due predict rounds
        env:
          PUBLIC_BASE_URL: https://vexa.games
        run: |
          set -euo pipefail
          for market in bitcoin ton; do
            curl --fail --show-error --silent \
              --max-time 20 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              "${PUBLIC_BASE_URL}/app/api/predict-round?market=${market}" \
              >/dev/null
          done

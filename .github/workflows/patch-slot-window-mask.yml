name: Patch slot window bottom mask

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-slot-window-mask.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch active slot CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/slot-styles.ts')
          text = path.read_text()

          replacements = {
              '  height:39%!important;': '  height:36%!important;',
              '#slot .slot-cabinet .slot-reel:first-child{transform:translateX(14px)!important}': '#slot .slot-cabinet .slot-reel:first-child{transform:translateX(20px)!important}',
              '#slot .slot-cabinet .slot-reel:last-child{transform:translateX(-14px)!important}': '#slot .slot-cabinet .slot-reel:last-child{transform:translateX(-20px)!important}',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          marker = "#slot .slot-cabinet .slot-window::before,\n#slot .slot-cabinet .slot-window::after{\n  height:24%!important;\n  z-index:6!important;\n  opacity:.82;\n}\n"
          replacement = marker + "#slot .slot-cabinet .slot-window::after{\n  height:38%!important;\n  bottom:0!important;\n  background:linear-gradient(0deg,rgba(5,2,3,1) 0%,rgba(8,4,5,.98) 72%,rgba(8,4,5,.82) 88%,rgba(8,4,5,0) 100%)!important;\n  opacity:1!important;\n}\n"
          if marker not in text:
              raise SystemExit('Could not find active slot-window overlay block')
          if '#slot .slot-cabinet .slot-window::after{\n  height:38%!important;' not in text:
              text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-slot-window-mask.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/miniapp/slot-styles.ts .github/workflows/patch-slot-window-mask.yml
          git commit -m 'Mask slot window bottom and tighten outer reels'
          git push origin main

name: Diagnose RPS references

on:
  push:
    branches:
      - chatgpt/restore-playhub-remove-rps
    paths:
      - '.github/workflows/diagnose-rps-references.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/restore-playhub-remove-rps
          fetch-depth: 0
      - name: Print exact active references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== telegram-bot-admin-panel.ts ==='
          grep -nEi -C 2 'rps|rock paper scissors|سنگ کاغذ قیچی' src/telegram-bot-admin-panel.ts || true
          echo '=== app-background-overrides.ts ==='
          grep -nEi -C 2 'rps|rock paper scissors|سنگ کاغذ قیچی' src/miniapp/app-background-overrides.ts || true
          echo '=== slot.ts ==='
          grep -nEi -C 2 'rps|rock paper scissors|سنگ کاغذ قیچی' src/miniapp/slot.ts || true
          echo '=== all tracked active files ==='
          git grep -nEi 'rps|rock paper scissors|سنگ کاغذ قیچی' -- ':!migrations/0018_remove_retired_game.sql' || true

name: Fix active slot window

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slot-window-active.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch active slot override
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/play-zone-edge-fix.ts')
          text = path.read_text()

          if '  height:242px!important;' in text:
              text = text.replace('  height:242px!important;', '  height:188px!important;', 1)
          elif '  height:188px!important;' not in text:
              raise SystemExit('Active slot window height override not found')

          old_after = "html body:has(#slot.active) #slot .slot-window::before,\nhtml body:has(#slot.active) #slot .slot-window::after{height:57px!important}"
          new_after = """html body:has(#slot.active) #slot .slot-window::before,
html body:has(#slot.active) #slot .slot-window::after{height:57px!important}
html body:has(#slot.active) #slot .slot-window::after{
  bottom:0!important;
  height:57px!important;
  background:linear-gradient(0deg,rgba(0,0,0,.88),transparent)!important;
  opacity:1!important;
}"""
          if old_after in text and 'background:linear-gradient(0deg,rgba(0,0,0,.88),transparent)!important;' not in text:
              text = text.replace(old_after, new_after, 1)

          marker = "html body:has(#slot.active) #slot .slot-symbol{height:80px!important}"
          rules = """html body:has(#slot.active) #slot .slot-reel:first-child{transform:translateX(24px)!important}
html body:has(#slot.active) #slot .slot-reel:last-child{transform:translateX(-24px)!important}
"""
          if marker not in text:
              raise SystemExit('Slot symbol marker not found')
          if 'html body:has(#slot.active) #slot .slot-reel:first-child' not in text:
              text = text.replace(marker, rules + marker, 1)

          path.write_text(text)
          PY
      - name: Remove one-time workflows
        run: |
          rm -f .github/workflows/fix-slot-window-active.yml
          rm -f .github/workflows/fix-slot-window-root.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/miniapp/play-zone-edge-fix.ts .github/workflows/fix-slot-window-active.yml .github/workflows/fix-slot-window-root.yml
          git commit -m 'Fix active slot window geometry at source'
          git push origin main

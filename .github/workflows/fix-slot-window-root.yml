name: Fix slot window root layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slot-window-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix actual active slot layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edge = Path('src/miniapp/play-zone-edge-fix.ts')
          edge_text = edge.read_text()

          old_height = '  height:242px!important;'
          new_height = '  height:188px!important;'
          if edge_text.count(old_height) != 1:
              raise SystemExit(f'Expected one active slot height override, found {edge_text.count(old_height)}')
          edge_text = edge_text.replace(old_height, new_height, 1)

          marker = "html body:has(#slot.active) #slot .slot-window::before,\nhtml body:has(#slot.active) #slot .slot-window::after{height:57px!important}\n"
          inward_rules = "html body:has(#slot.active) #slot .slot-reel:first-child{transform:translateX(24px)!important}\nhtml body:has(#slot.active) #slot .slot-reel:last-child{transform:translateX(-24px)!important}\n"
          if marker not in edge_text:
              raise SystemExit('Active slot-window marker not found')
          if 'html body:has(#slot.active) #slot .slot-reel:first-child' not in edge_text:
              edge_text = edge_text.replace(marker, marker + inward_rules, 1)
          edge.write_text(edge_text)

          styles = Path('src/miniapp/slot-styles.ts')
          styles_text = styles.read_text()

          mask = """#slot .slot-cabinet .slot-window::after{
  height:38%!important;
  bottom:0!important;
  background:linear-gradient(0deg,rgba(5,2,3,1) 0%,rgba(8,4,5,.98) 72%,rgba(8,4,5,.82) 88%,rgba(8,4,5,0) 100%)!important;
  opacity:1!important;
}
"""
          if mask not in styles_text:
              raise SystemExit('Temporary slot bottom mask not found')
          styles_text = styles_text.replace(mask, '', 1)

          for rule in [
              '#slot .slot-cabinet .slot-reel:first-child{transform:translateX(20px)!important}\n',
              '#slot .slot-cabinet .slot-reel:last-child{transform:translateX(-20px)!important}\n',
          ]:
              styles_text = styles_text.replace(rule, '', 1)

          styles.write_text(styles_text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-slot-window-root.yml
      - name: Commit root fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/miniapp/play-zone-edge-fix.ts src/miniapp/slot-styles.ts .github/workflows/fix-slot-window-root.yml
          git commit -m 'Fix actual slot window height and reel alignment'
          git push origin main

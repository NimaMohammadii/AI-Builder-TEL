name: Patch slot reel layout stronger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-slot-reel-layout-stronger.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch active slot CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/miniapp/slot-styles.ts')
          text = path.read_text()

          replacements = {
              '  height:46.5%!important;': '  height:39%!important;',
              '#slot .slot-cabinet .slot-reel:first-child{transform:translateX(7px)!important}': '#slot .slot-cabinet .slot-reel:first-child{transform:translateX(14px)!important}',
              '#slot .slot-cabinet .slot-reel:last-child{transform:translateX(-7px)!important}': '#slot .slot-cabinet .slot-reel:last-child{transform:translateX(-14px)!important}',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-slot-reel-layout-stronger.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/miniapp/slot-styles.ts .github/workflows/patch-slot-reel-layout-stronger.yml
          git commit -m 'Tighten outer slot reels and shorten window further'
          git push origin main

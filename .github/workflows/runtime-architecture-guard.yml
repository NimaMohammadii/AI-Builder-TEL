name: Protect Mini App Runtime Architecture

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-architecture-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Telegram webhook target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://v.vexaagent.workers.dev/setup-webhook)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"webhookUrl":"https://vexa.games/telegram/webhook"'

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Verify TypeScript and protected Mini App runtime architecture
        run: npm run verify

name: Protect Mini App Runtime Architecture

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-architecture-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose live Worker origin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          status="$(curl --silent --show-error --output /tmp/vexa-app.html --write-out '%{http_code}' https://v.vexaagent.workers.dev/app)"
          printf 'WORKER_STATUS=%s\n' "$status"
          test "$status" = "200"
          grep -q 'Vexa' /tmp/vexa-app.html
          printf 'WORKER_APP_OK=true\n'

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Verify TypeScript and protected Mini App runtime architecture
        run: npm run verify

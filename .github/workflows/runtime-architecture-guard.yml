name: Protect Mini App Runtime Architecture

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-architecture-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose and refresh Telegram webhook target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dns="$(curl --fail --silent --show-error --resolve cloudflare-dns.com:443:1.1.1.1 'https://cloudflare-dns.com/dns-query?name=vexa.games&type=A' -H 'accept: application/dns-json')"
          printf 'DNS: %s\n' "$dns"
          ip="$(printf '%s' "$dns" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=(j.Answer||[]).find(x=>x.type===1);if(a)process.stdout.write(a.data)})")"
          test -n "$ip"
          response="$(curl --fail --silent --show-error --resolve vexa.games:443:$ip https://vexa.games/setup-webhook)"
          printf 'SETUP: %s\n' "$response"
          printf '%s' "$response" | grep -q '"ok":true'

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Verify TypeScript and protected Mini App runtime architecture
        run: npm run verify
